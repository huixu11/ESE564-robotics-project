[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "basket-sorting"
version = "0.1.0"
description = "Language-conditioned basket sorting scaffold with continuity-aware IK control."
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pillow",
  "pyyaml",
]

[tool.setuptools.packages.find]
where = ["src"]
